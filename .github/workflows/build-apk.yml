name: Build & Publish Car DSP APK Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Ready-to-Install Release APK
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Car-DSP-OEM-Restorer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Car-DSP-OEM-Restorer-APK
          path: Car-DSP-OEM-Restorer.apk

      - name: Publish APK to GitHub Releases (Direct Download for Car HU)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Car DSP OEM Sound Restorer v1.0.0 (Direct APK)"
          body: |
            ### 🚗 Download & Install di Head Unit Android
            Klik file **`Car-DSP-OEM-Restorer.apk`** di bawah bagian **Assets** untuk langsung download dan install di Head Unit Android mobil.
          files: Car-DSP-OEM-Restorer.apk
          prerelease: false
          make_latest: true
